<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Dario Cerisano</title>
    <link rel="stylesheet" href="style.css?v=32">
    <link rel="stylesheet" href="https://use.typekit.net/hsl8mqb.css">
</head>
<body>
<section id="header">
  <div id="header-left">Dario Cerisano</div>
  <div id="header-center">
    <span class="filter-btn" data-category="editorial">editorial</span>|
    <span class="filter-btn" data-category="campaign">campaign</span>|
    <span class="filter-btn" data-category="analogue">analogue</span>
  </div>
  <div id="header-right">
    <div id="hero-toggle">▼</div>
  </div>
  <div id="hero">
    <div id="hero-links">
      <a href="mailto:dariocerisano@gmail.com">e-mail</a>|
      <a href="https://www.instagram.com/dariocerisano">instagram</a>
    </div>
    <div id="hero-subtitle">Art director and photographer</div>
    <img src="./img/0.png" alt="Dario Cerisano">
  </div>
</section>


    <div id="projects-container"></div>
</body>

    <script>
        // Google Sheet published CSV URL
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQD9yhBmVkscTAjyKbHkvD_kvtZoAzz0SC8U3BJ83RrJUaYuaZei2JRVREMGN6i1kByUI0b-4tSXfUu/pub?output=csv&gid=0';

        // Parse CSV into array of objects (handles multi-line quoted fields)
        function parseCSV(csv) {
            const rows = [];
            let current = '';
            let inQuotes = false;

            // First, split into rows (handling quoted newlines)
            for (let i = 0; i < csv.length; i++) {
                const char = csv[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                    current += char;
                } else if (char === '\n' && !inQuotes) {
                    if (current.trim()) rows.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            if (current.trim()) rows.push(current);

            // Parse header
            const headers = rows[0].split(',').map(h => h.trim().toLowerCase());

            // Parse each data row
            return rows.slice(1).map(row => {
                const values = [];
                let val = '';
                let quoted = false;

                for (let i = 0; i < row.length; i++) {
                    const char = row[i];
                    if (char === '"') {
                        quoted = !quoted;
                    } else if (char === ',' && !quoted) {
                        values.push(val.trim());
                        val = '';
                    } else {
                        val += char;
                    }
                }
                values.push(val.trim());

                const obj = {};
                headers.forEach((header, idx) => {
                    obj[header] = values[idx] || '';
                });
                return obj;
            });
        }

        // Create project HTML from data
        function createProjectHTML(project) {
            // Convert filenames like "1a, 1b, 1c" to image tags
            const filenames = project.filenames.split(',').map(f => f.trim());

            const imagesHTML = filenames
                .map(name => `<img src="./img/${name}.jpg">`)
                .join('\n            ');

            return `
    <div class="project-container" data-category="${project.category}">
        <div class="main-row">
        <div class="marquee">
            ${imagesHTML}
        </div>
        <div class="project-information">
            <div class="project-title">${project.name}</div>
            <div class="project-subtitle">${project.subtitle || project.category}</div>
            <div class="year">${project.year}</div>
            <div class="expand">▼</div>
        </div>
        </div>
        <div class="credits">
            <span>${project.credits}</span>
        </div>
    </div>`;
        }

        // Setup hero expand/collapse
        function setupHeroToggle() {
            const toggle = document.getElementById('hero-toggle');
            const header = document.getElementById('header');
            const hero = document.getElementById('hero');

            function collapseHero() {
                if (!header.classList.contains('collapsed')) {
                    header.classList.add('collapsed');
                    toggle.classList.add('flipped');
                }
            }

            function toggleHero() {
                header.classList.toggle('collapsed');
                toggle.classList.toggle('flipped');
            }

            // Click on arrow toggles
            toggle.addEventListener('click', toggleHero);

            // Click on hero collapses
            hero.addEventListener('click', collapseHero);

            // Scroll down collapses hero (first scroll only)
            let heroScrolled = false;
            window.addEventListener('wheel', (e) => {
                if (!heroScrolled && e.deltaY > 0) {
                    collapseHero();
                    heroScrolled = true;
                }
            });
        }

        // Setup credits expand/collapse
        function setupCreditsToggle() {
            document.querySelectorAll('.project-container').forEach(container => {
                const info = container.querySelector('.project-information');
                const expander = container.querySelector('.expand');
                const credits = container.querySelector('.credits');

                if (!info || !expander || !credits) return;

                info.addEventListener('click', function() {
                    // Close all others
                    document.querySelectorAll('.credits.expanded').forEach(c => {
                        if (c !== credits) c.classList.remove('expanded');
                    });
                    document.querySelectorAll('.expand.flipped').forEach(el => {
                        if (el !== expander) el.classList.remove('flipped');
                    });

                    credits.classList.toggle('expanded');
                    expander.classList.toggle('flipped');
                });
            });
        }

        // Setup category filters
        function setupFilters() {
            const filterBtns = document.querySelectorAll('.filter-btn');
            const activeCategories = new Set(['editorial', 'campaign', 'analogue']);

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const category = btn.dataset.category;

                    // If trying to hide and it's the last one, don't allow
                    if (activeCategories.has(category) && activeCategories.size === 1) {
                        return;
                    }

                    if (activeCategories.has(category)) {
                        activeCategories.delete(category);
                        btn.classList.add('hidden');
                    } else {
                        activeCategories.add(category);
                        btn.classList.remove('hidden');
                    }

                    // Show/hide projects with collapse transition
                    document.querySelectorAll('.project-container').forEach(project => {
                        const projectCat = project.dataset.category;
                        if (activeCategories.has(projectCat)) {
                            project.classList.remove('collapsed');
                        } else {
                            project.classList.add('collapsed');
                        }
                    });
                });
            });
        }

        // Start marquee animation for all carousels (only one at a time)
        function startMarquees() {
            const marquees = document.querySelectorAll('.marquee');
            const marqueeData = [];

            marquees.forEach((marquee) => {
                const images = Array.from(marquee.querySelectorAll('img'));

                // Skip if only one image
                if (images.length <= 1) {
                    marqueeData.push(null);
                    return;
                }

                let totalWidth = 0;
                images.forEach(img => totalWidth += img.offsetWidth);

                // Clone all images for seamless loop
                images.forEach(image => {
                    const clone = image.cloneNode(true);
                    marquee.appendChild(clone);
                });

                marqueeData.push({
                    element: marquee,
                    totalWidth,
                    currentPosition: 0,
                    isActive: false
                });
            });

            const speed = 0.5; // Slower speed

            let activeMarquee = null;

            // Observe which marquee is most visible - that one MOVES
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const data = marqueeData.find(d => d && d.element === entry.target);
                    if (data) {
                        data.ratio = entry.intersectionRatio;
                    }
                });

                // Find the most visible marquee (>50%)
                let mostVisible = null;
                let highestRatio = 0.5;

                marqueeData.forEach(data => {
                    if (data && data.ratio > highestRatio) {
                        highestRatio = data.ratio;
                        mostVisible = data;
                    }
                });

                activeMarquee = mostVisible;
            }, { threshold: [0, 0.25, 0.5, 0.75, 1] });

            // Add interactions: click/hold and scroll pause the animation
            marqueeData.forEach(data => {
                if (!data) return;

                observer.observe(data.element);
                data.isInteracting = false;

                // Click and hold to pause
                data.element.addEventListener('mousedown', () => {
                    data.isInteracting = true;
                });
                document.addEventListener('mouseup', () => {
                    data.isInteracting = false;
                });

                // Scroll to pause and manually control
                let scrollTimeout;
                data.element.addEventListener('wheel', (e) => {
                    if (activeMarquee !== data) return;

                    e.preventDefault();
                    data.isInteracting = true;

                    // Manual scroll
                    const delta = e.deltaX !== 0 ? e.deltaX : e.deltaY;
                    data.currentPosition -= delta;

                    // Wrap around
                    if (data.currentPosition > 0) {
                        data.currentPosition -= data.totalWidth;
                    } else if (data.currentPosition <= -data.totalWidth) {
                        data.currentPosition += data.totalWidth;
                    }

                    data.element.style.transform = `translateX(${data.currentPosition}px)`;

                    // Resume auto-scroll after 1 second of no scrolling
                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => {
                        data.isInteracting = false;
                    }, 1000);
                }, { passive: false });
            });

            // Animate only the active marquee (unless interacting)
            function step() {
                if (activeMarquee && !activeMarquee.isInteracting) {
                    activeMarquee.currentPosition -= speed;
                    if (activeMarquee.currentPosition <= -activeMarquee.totalWidth) {
                        activeMarquee.currentPosition += activeMarquee.totalWidth;
                    }
                    activeMarquee.element.style.transform = `translateX(${activeMarquee.currentPosition}px)`;
                }
                requestAnimationFrame(step);
            }

            step();
        }

        // Fetch data and build page
        async function init() {
            try {
                const response = await fetch(SHEET_URL);
                const csv = await response.text();
                const projects = parseCSV(csv);

                const container = document.getElementById('projects-container');
                container.innerHTML = projects.map(p => createProjectHTML(p)).join('');

                // Wait for all images to load, then start marquees
                const allImages = container.querySelectorAll('img');
                let loaded = 0;
                const total = allImages.length;

                allImages.forEach(img => {
                    const handleLoad = () => {
                        loaded++;
                        if (loaded === total) startMarquees();
                    };

                    if (img.complete) {
                        handleLoad();
                    } else {
                        img.addEventListener('load', handleLoad);
                        img.addEventListener('error', handleLoad); // Count errors too
                    }
                });

                setupFilters();
                setupCreditsToggle();
                setupHeroToggle();

            } catch (error) {
                console.error('Failed to load projects:', error);
            }
        }

        init();
    </script>
