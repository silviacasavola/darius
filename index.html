<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Dario Cerisano</title>
    <link rel="stylesheet" href="style.css?v=46">
    <link rel="stylesheet" href="https://use.typekit.net/hsl8mqb.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/embla-carousel/embla-carousel.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/embla-carousel-autoplay/embla-carousel-autoplay.umd.js"></script>
    <style>
        .marquee {
            overflow: hidden;
            height: 100vh;
        }
        .marquee__container {
            display: flex;
            align-items: center;
            height: 100%;
        }
        .marquee__slide {
            flex: 0 0 auto;
            min-width: 0;
            height: 80vh;
            position: relative;
        }
        .marquee__slide.is-selected {
            z-index: 2;
        }
        .marquee__slide img {
            height: 100%;
            width: auto;
            display: block;
            opacity: 0.4;
            transform: scale(1);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .marquee__slide.is-selected img {
            transform: scale(1.25);
            opacity: 1;
        }
    </style>
</head>
<body>
<section id="header">
  <a id="header-email" href="mailto:dariocerisano@gmail.com">dariocerisano@gmail.com</a>
  <div id="header-name">Dario Cerisano</div>
  <div id="header-center">
    <span class="filter-btn" data-category="editorial">editorial</span>|
    <span class="filter-btn" data-category="campaign">campaign</span>|
    <span class="filter-btn" data-category="analogue">analogue</span>
  </div>
  <a id="header-instagram" href="https://www.instagram.com/dariocerisano">@dariocerisano</a>
</section>


    <div id="projects-container"></div>
</body>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQD9yhBmVkscTAjyKbHkvD_kvtZoAzz0SC8U3BJ83RrJUaYuaZei2JRVREMGN6i1kByUI0b-4tSXfUu/pub?output=csv&gid=0';

        function parseCSV(csv) {
            const rows = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < csv.length; i++) {
                const char = csv[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                    current += char;
                } else if (char === '\n' && !inQuotes) {
                    if (current.trim()) rows.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            if (current.trim()) rows.push(current);

            const headers = rows[0].split(',').map(h => h.trim().toLowerCase());

            return rows.slice(1).map(row => {
                const values = [];
                let val = '';
                let quoted = false;

                for (let i = 0; i < row.length; i++) {
                    const char = row[i];
                    if (char === '"') {
                        quoted = !quoted;
                    } else if (char === ',' && !quoted) {
                        values.push(val.trim());
                        val = '';
                    } else {
                        val += char;
                    }
                }
                values.push(val.trim());

                const obj = {};
                headers.forEach((header, idx) => {
                    obj[header] = values[idx] || '';
                });
                return obj;
            });
        }

        function createProjectHTML(project) {
            const filenames = project.filenames.split(',').map(f => f.trim());

            const slidesHTML = filenames
                .map(name => `<div class="marquee__slide"><img src="./img/${name}.jpg"></div>`)
                .join('\n            ');

            return `
    <div class="project-container" data-category="${project.category}">
        <div class="main-row">
        <div class="marquee">
            <div class="marquee__container">
                ${slidesHTML}
            </div>
        <div class="project-information2"><span class="name2">${project.name}</span><span class="year2">${project.subtitle || project.category}, ${project.year}</span><span class="credits2">full credits ▾</span></div>
        </div>
        <div class="project-information">${project.name} (${project.subtitle || project.category}, ${project.year}) <span class="expand">▾</span></div>
        </div>
        <div class="credits">
            <span>${project.credits}</span>
        </div>
    </div>`;
        }

        // Shared state used by both setupCreditsToggle and startCarousels
        let creditsIgnoreUntil = 0;

        // Custom smooth scroll with ease-in-out (gentler than native behavior: smooth)
        let scrollAnimRaf = null;
        function smoothScrollTo(targetY, duration = 900) {
            const startY = window.scrollY;
            const dist = targetY - startY;
            if (Math.abs(dist) < 1) return;
            if (scrollAnimRaf) cancelAnimationFrame(scrollAnimRaf);

            const prevSnap = document.documentElement.style.scrollSnapType;
            document.documentElement.style.scrollSnapType = 'none';

            const startTime = performance.now();
            function tick(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                window.scrollTo(0, startY + dist * ease);
                if (t < 1) {
                    scrollAnimRaf = requestAnimationFrame(tick);
                } else {
                    scrollAnimRaf = null;
                    document.documentElement.style.scrollSnapType = prevSnap;
                }
            }
            scrollAnimRaf = requestAnimationFrame(tick);
        }
        function closeAllCredits() {
            if (performance.now() < creditsIgnoreUntil) return;
            if (!document.querySelector('.credits.expanded')) return;
            document.querySelectorAll('.credits.expanded').forEach(c => {
                c.classList.remove('expanded');
            });
            document.querySelectorAll('.expand').forEach(el => {
                el.classList.remove('flipped');
                el.innerHTML = '▾';
            });
            document.querySelectorAll('.credits2').forEach(el => {
                el.innerHTML = 'full credits ▾';
            });
        }

        function setupCreditsToggle() {
            document.querySelectorAll('.project-container').forEach(container => {
                const info = container.querySelector('.project-information');
                const expander = container.querySelector('.expand');
                const credits = container.querySelector('.credits');
                const credits2btn = container.querySelector('.credits2');

                if (!info || !expander || !credits) return;

                function handleToggle() {
                    document.querySelectorAll('.credits.expanded').forEach(c => {
                        if (c !== credits) {
                            c.classList.remove('expanded');
                            c.style.maxHeight = '';
                        }
                    });
                    document.querySelectorAll('.expand').forEach(el => {
                        if (el !== expander) {
                            el.classList.remove('flipped');
                            el.innerHTML = '▾';
                        }
                    });
                    document.querySelectorAll('.credits2').forEach(el => {
                        if (el !== credits2btn) el.innerHTML = 'full credits ▾';
                    });

                    const willExpand = !credits.classList.contains('expanded');
                    credits.classList.toggle('expanded');
                    expander.classList.toggle('flipped');
                    expander.innerHTML = willExpand ? '▴' : '▾';
                    if (credits2btn) credits2btn.innerHTML = willExpand ? 'full credits ▴' : 'full credits ▾';

                    if (willExpand) {
                        const expansion = Math.min(credits.scrollHeight, window.innerHeight * 0.5);

                        creditsIgnoreUntil = performance.now() + 1500;
                        const containerRect = container.getBoundingClientRect();
                        const targetY = window.scrollY + containerRect.bottom + expansion - window.innerHeight;
                        smoothScrollTo(targetY, 900);
                    }
                }

                info.addEventListener('click', handleToggle);
                if (credits2btn) credits2btn.addEventListener('click', handleToggle);
            });
        }

        function setupFilters() {
            const filterBtns = document.querySelectorAll('.filter-btn');
            const activeCategories = new Set(['editorial', 'campaign', 'analogue']);

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const category = btn.dataset.category;

                    if (activeCategories.has(category) && activeCategories.size === 1) {
                        return;
                    }

                    if (activeCategories.has(category)) {
                        activeCategories.delete(category);
                        btn.classList.add('hidden');
                    } else {
                        activeCategories.add(category);
                        btn.classList.remove('hidden');
                    }

                    document.querySelectorAll('.project-container').forEach(project => {
                        const projectCat = project.dataset.category;
                        if (activeCategories.has(projectCat)) {
                            project.classList.remove('collapsed');
                        } else {
                            project.classList.add('collapsed');
                        }
                    });
                });
            });
        }

        // Initialize a simple Embla carousel for each project
        function startCarousels() {
            document.querySelectorAll('.marquee').forEach(viewport => {
                const container = viewport.querySelector('.marquee__container');
                const originalSlides = Array.from(container.children);
                if (originalSlides.length < 2) return;

                // Embla's loop needs enough total slide width to engage. Duplicate
                // slides in DOM until the total content is well past the viewport width.
                const viewportWidth = viewport.clientWidth;
                let safety = 0;
                while (container.scrollWidth < viewportWidth * 3 && safety++ < 20) {
                    originalSlides.forEach(slide => container.appendChild(slide.cloneNode(true)));
                }

                const autoplay = EmblaCarouselAutoplay({
                    delay: 3000,
                    playOnInit: false,
                    stopOnInteraction: false,
                    stopOnMouseEnter: true,
                });

                const embla = EmblaCarousel(viewport, {
                    loop: true,
                    align: 'center',
                }, [autoplay]);
                setTimeout(() => embla.reInit(), 150);

                // Active slide gets .is-selected → bigger, brighter, higher z-index
                const updateSelected = () => {
                    const idx = embla.selectedScrollSnap();
                    embla.slideNodes().forEach((slide, i) => {
                        slide.classList.toggle('is-selected', i === idx);
                    });
                };
                embla.on('select', updateSelected);
                embla.on('reInit', updateSelected);
                updateSelected();

                // Click a slide to scroll to it
                embla.slideNodes().forEach((slide, i) => {
                    slide.style.cursor = 'pointer';
                    slide.addEventListener('click', () => embla.scrollTo(i));
                });

                // Only play when the carousel is nearly fully in view
                // (i.e., the user has settled on this project, not mid-scroll).
                // Same view-change moment also closes any expanded credits.
                const projectContainer = viewport.closest('.project-container');

                const ioInView = new IntersectionObserver(entries => {
                    entries.forEach(e => {
                        if (e.isIntersecting) {
                            autoplay.play();
                            projectContainer?.classList.add('in-view');
                        } else {
                            autoplay.stop();
                            projectContainer?.classList.remove('in-view');
                        }
                    });
                }, { threshold: 0.5 });
                ioInView.observe(viewport);

                const ioCredits = new IntersectionObserver(entries => {
                    entries.forEach(e => {
                        if (!e.isIntersecting) setTimeout(closeAllCredits, 500);
                    });
                }, { threshold: 0.95 });
                ioCredits.observe(viewport);
            });
        }

        function loadFallbackProjects() {
            if (window.PROJECTS_FALLBACK) {
                return Promise.resolve(window.PROJECTS_FALLBACK);
            }
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = './projects-fallback.js';
                script.onload = () => resolve(window.PROJECTS_FALLBACK);
                script.onerror = () => reject(new Error('Failed to load projects-fallback.js'));
                document.head.appendChild(script);
            });
        }

        async function loadProjects() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return parseCSV(await response.text());
            } catch (error) {
                console.warn('Sheet fetch failed, using local fallback:', error);
                return loadFallbackProjects();
            }
        }

        async function init() {
            try {
                const projects = await loadProjects();
                const container = document.getElementById('projects-container');
                container.innerHTML = projects.map(p => createProjectHTML(p)).join('');

                // Set first project as default so there's no blank state before observers fire
                container.querySelector('.project-container')?.classList.add('in-view');
                container.querySelector('.marquee__slide')?.classList.add('is-selected');

                setupFilters();
                setupCreditsToggle();

                // Wait for all images to load (with actual dimensions) so Embla measures correctly
                const allImages = Array.from(container.querySelectorAll('img'));
                await Promise.all(allImages.map(img =>
                    (img.complete && img.naturalWidth > 0)
                        ? Promise.resolve()
                        : new Promise(resolve => {
                            img.addEventListener('load', resolve);
                            img.addEventListener('error', resolve);
                        })
                ));
                // One more frame for layout to settle before Embla measures
                await new Promise(resolve => requestAnimationFrame(resolve));

                startCarousels();

            } catch (error) {
                console.error('Failed to load projects:', error);
            }
        }

        init();
    </script>
</html>
